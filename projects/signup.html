<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Corrected CSS Link -->
    <link rel="stylesheet" href="/projects/signup.css" />

    <title>SignUp Page</title>
</head>

<body>
    <div id="outer">
        <form id="myForm">
            <h1>Create Account</h1>
            <label for="name">Full Name:</label>
            <br />
            <input id="name" type="text" class="textBox" required placeholder="Enter Your Full Name"
                autocomplete="off" />
            <br />

            <label for="email">Email ID:</label>
            <br />
            <input id="email" type="email" class="textBox" required placeholder="Enter Your Email ID"
                autocomplete="off" />
            <br />
            <span id="exist"></span>

            <label for="telephone">Mobile Number:</label>
            <br />
            <input type="tel" class="textBox" id="telephone" placeholder="Enter Your Mobile Number" required
                autocomplete="off" minlength="10" maxlength="10" />
            <br />

            <label for="option">Country:</label>
            <br />
            <select id="option" class="textBox" required name="country" autocomplete="off">
                <option value="country">Select Your Country</option>
                <option value="india">India</option>
                <option value="australia">Australia</option>
                <option value="america">America</option>
                <option value="canada">Canada</option>
                <option value="russia">Russia</option>
                <option value="france">France</option>
                <option value="japan">Japan</option>
                <option value="spain">Spain</option>
                <option value="turkey">Turkey</option>
            </select>
            <br />

            <label for="gender">Gender:</label>
            <br />
            <select class="textBox" id="gender" required name="gender" autocomplete="off">
                <option value="gender">Select Your Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <br />

            <div class="input-containers">
                <label for="password">Create Your Password:</label>
                <br />
                <input id="password" type="password" required minlength="4" maxlength="20"
                    placeholder="Enter Password" class="textBox" />
                <img src="/projects/images/i.png" alt="Toggle Password Visibility" onclick="showPasswords()" id="eyes"
                    ondragstart="return false;">
                <br />

                <div class="input-container">
                    <label for="confirmPass">Confirm Your Password:</label>
                    <br />
                    <input id="confirmPass" type="password" class="textBox" required minlength="4" maxlength="20"
                        placeholder="Enter Your Password Again" />
                    <img src="/projects/images/i.png" alt="Toggle Password Visibility" onclick="showPassword()" id="eye"
                        ondragstart="return false;">
                </div>
                <br />
                <span id="message"></span>

                <label for="submit"></label>
                <br />
                <input type="submit" id="submit" value="SIGN UP" />
                <br />

                <p class="alert">
                    -----------------------OR-----------------------<br />
                    Already have an account?
                </p>
                <input type="button" onclick="loginPage()" id="Submit" value="LOGIN" />
            </div>
        </form>
    </div>
    
    <!-- Corrected JavaScript Link -->
    <script src="/projects/signup.js" defer></script>
</body>

</html>
