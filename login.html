<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script src="./login.js"></script>
    <link>
    <title>LogIn Page</title>
</head>

<body
    style="background-image: url(images/background-img.png); background-size:100vw 100vh ; background-repeat: no-repeat;">
    <div id="form">
        <form action="#">
            <h1>Log In </h1>
            <label for="email">Email ID:</label>

            <br>
            <input type="email" id="email" class="Email" required autocomplete="off"
                placeholder="Enter Your Registered Email Id"></input>
            <br>

            <span id="notMatchEmail"></span>

            <div class="input-container">
                <label for="password">Password:</label>
                <br>
                <input type="password" id="password" class="Password" minlength="4" maxlength="20"
                    placeholder="Enter Your password">
                <img src="images/i.png" alt="Toggle Password Visibility" onclick="showPass()" id="eye"
                    ondragstart="return false;">
            </div>


            <br>
            <span id="notMatchPassword"></span>

            <label for="submit"></label>
            <br>
            <input type="submit" id="submit" value="LOGIN" class="submit">
            <p class="or">
                ---------------------OR---------------------<br />
                Don't have an account ?Click on SignUp!
            </p>
            <input type="submit" id="register" class="register" onclick="signupPage()" value="SIGN UP" />
        </form>
    </div>
    </div>
</body>

</html>
